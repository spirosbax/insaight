[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "insaight"
version = "0.1.0"
description = "LinkedIn prospect intelligence for Claude — MCP server + skills for research, outreach drafting, and a memory loop that learns what gets replies."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Spiros Baxevanakis" }]
keywords = ["mcp", "claude", "linkedin", "apify", "sales", "outreach"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business",
]
dependencies = [
  "apify-client>=3.0,<4",
  "click>=8.1",
  "python-dotenv>=1.0",
  "anthropic>=0.40",
  "mcp[cli]>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/spirosbax/insaight"
Issues = "https://github.com/spirosbax/insaight/issues"

[project.scripts]
insaight = "insaight.mcp_server:main"
insaight-cli = "insaight.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["insaight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
